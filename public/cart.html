<!DOCTYPE html>
<html>

<head>
    <title>Cart</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

    <div id="navbar-container"></div>

    <main class="page-container cart-page">
        <div class="cart-page-heading">
            <div>
                <p class="home-eyebrow">YOUR HANDMADE FINDS</p>
                <h1>Your Cart</h1>
            </div>
            <a class="text-link" href="products.html">← Continue shopping</a>
        </div>
        <p id="cartStatus" class="cart-status" role="status" aria-live="polite"></p>
        <div class="cart-layout">
            <section id="cart" class="cart-items" aria-label="Items in your cart"></section>
            <aside class="cart-summary" aria-labelledby="cartSummaryTitle">
                <h2 id="cartSummaryTitle">Order summary</h2>
                <p><span>Subtotal</span><strong id="subtotal">₹0</strong></p>
                <p class="cart-total-line"><span>Total</span><strong id="total">₹0</strong></p>
                <p class="cart-shipping-note">Shipping and payment details will be confirmed by the store.</p>
                <a id="checkoutLink" class="primary-link-button" href="checkout.html">Proceed to Checkout</a>
                <a class="secondary-link-button" href="products.html">Continue Shopping</a>
            </aside>
        </div>
    </main>

    <div id="footer-container"></div>

<div class="bottom-nav">
        <a href="index.html">🏠</a>
        <a href="products.html">🛍️</a>
        <a href="cart.html" class="active">🛒</a>
        <a href="login.html">👤</a>
    </div>

    <script src="js/common.js"></script>
    <script src="cart.js"></script>

</body>

</html>
