<!DOCTYPE html>
<html>

<head>
    <title>Products | Art Corner BLR</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body class="products-page">

    <div id="navbar-container"></div>

    <div class="page-container">

        <h1 id="pageTitle">✨ All Products</h1>
        <p class="subtitle" id="pageSubtitle">
            Discover our handcrafted collection
        </p>

        <div class="products-toolbar" aria-label="Product browsing controls">
            <button id="productSearchToggle" class="product-search-toggle" type="button" aria-expanded="false" aria-controls="productSearchPanel" aria-label="Open product search">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="10.8" cy="10.8" r="6.6"></circle><path d="m16 16 4.2 4.2"></path></svg>
                <span>Search</span>
            </button>
            <select id="categoryFilter" aria-label="Filter products by category">
            <option value="">All Products</option>
            </select>
        </div>
        <div id="productSearchPanel" class="product-search-panel" role="search" aria-label="Search products" hidden>
            <label class="visually-hidden" for="search">Search products by name</label>
            <input id="search" type="search" placeholder="Search products…" autocomplete="off">
            <button id="productSearchClose" class="product-search-close" type="button" aria-label="Close product search">×</button>
        </div>
        <p id="categoryFeedback" role="status" aria-live="polite"></p>

        <div id="products"></div>

    </div>

    <div id="footer-container"></div>

    <script src="js/common.js"></script>
    <script src="products.js"></script>

</body>

</html>
